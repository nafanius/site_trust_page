<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trust Site</title>
  <meta name="description" content="Multilingual static website powered by Google Sheets CMS">
  
  <!-- SEO & Social -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Trust Site">
  <meta property="og:description" content="Multilingual static website powered by Google Sheets CMS">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Canonical will be managed by JS for language variants -->
  <link rel="canonical" href="/">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/news.css">
  <link rel="stylesheet" href="css/templates.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo" id="logo-link">
        <img src="assets/logo.svg" alt="Trust Site" height="28" style="vertical-align:middle;">
      </a>

      <nav class="main-nav" id="main-nav">
        <!-- Populated by menu.js -->
      </nav>

      <div class="language-switcher" id="language-switcher">
        <!-- Populated by i18n.js / main.js -->
      </div>

      <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <main id="main-content">
    <!-- Dynamic content injected by JS -->
    <div id="page-content" class="container">
      <!-- Router renders here -->
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="footer-year"></span> Trust Site. All rights reserved.</p>
      <p class="footer-note">Content managed via Google Sheets.</p>
    </div>
  </footer>

  <!-- Scripts - load in order -->
  <script src="js/config.js"></script>
  <script src="js/router.js"></script>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/news.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
