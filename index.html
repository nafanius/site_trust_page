<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trust Site</title>
  <meta name="description" content="Multilingual static website powered by Google Sheets CMS">
  
  <!-- SEO & Social -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Trust Site">
  <meta property="og:description" content="Multilingual static website powered by Google Sheets CMS">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Canonical will be managed by JS for language variants -->
  <link rel="canonical" href="/">

  <!--
    Deployment base detection for GitHub project sites (/my-repo/) and root deployments.
    Inserts a <base> tag so that relative paths (css/, js/, assets/) resolve correctly
    even when the current URL has language prefixes like /ru or /pl/news.
    Must run before any relative asset links.
  -->
  <script>
    (function () {
      try {
        var pathname = (window.location.pathname || '/').split('?')[0].split('#')[0];
        pathname = pathname.replace(/\/index\.html?$/i, '/').replace(/\.html?$/i, '');
        pathname = pathname.replace(/\/+/g, '/');
        if (pathname.length > 1 && pathname.endsWith('/')) pathname = pathname.slice(0, -1);

        var segs = pathname.split('/').filter(Boolean);
        // Known application segments (languages + routes). Anything before the first of these is the deployment base.
        var known = { en: 1, ru: 1, pl: 1, news: 1, about: 1, contact: 1, contacts: 1, page: 1 };

        var baseIdx = 0;
        for (var i = 0; i < segs.length; i++) {
          if (known[segs[i].toLowerCase()]) { baseIdx = i; break; }
          baseIdx = i + 1;
        }
        var baseSegs = segs.slice(0, baseIdx);
        var base = baseSegs.length ? '/' + baseSegs.join('/') + '/' : '/';

        if (base && base !== '/') {
          var b = document.createElement('base');
          b.setAttribute('href', base);
          var head = document.head || document.getElementsByTagName('head')[0];
          if (head.firstChild) {
            head.insertBefore(b, head.firstChild);
          } else {
            head.appendChild(b);
          }
        }
      } catch (e) { /* never break page load */ }
    })();
  </script>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/news.css">
  <link rel="stylesheet" href="css/templates.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="site-header">

      <a href="/" class="logo" id="logo-link" data-route="/">
        <img src="assets/logo.svg" alt="Trust Site" height="28" style="vertical-align:middle;">
      </a>

      <nav class="main-nav" id="main-nav">
        <!-- Populated by menu.js -->
      </nav>

      <div class="language-switcher" id="language-switcher">
        <!-- Populated by i18n.js / main.js -->
      </div>

      <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <main id="main-content">
    <!-- Dynamic content injected by JS -->
    <div id="page-content" class="container">
      <!-- Router renders here -->
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="footer-year"></span> Trust Site. All rights reserved.</p>
      <p class="footer-note">Content managed via Google Sheets.</p>
    </div>
  </footer>

  <!-- Scripts - load in order -->
  <script src="js/config.js"></script>
  <script src="js/router.js"></script>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/news.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
