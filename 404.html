<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting... - Trust Site</title>
  <!--
    SPA fallback for GitHub Pages (and similar static hosts).
    When a deep link (/about, /news, /ru/about, etc.) is requested directly,
    the server returns this 404.html. We immediately redirect the browser
    to index.html (sibling file) while preserving the original path in a
    query parameter. The JS router then restores the clean URL.
    
    This works for both root deployments and project sites (/REPO/...)
    because 404.html is served from the same directory as index.html.
  -->
  <script>
    (function () {
      var loc = window.location;
      // The full path the user originally requested (including search/hash)
      var intended = (loc.pathname || '/') + (loc.search || '') + (loc.hash || '');

      // Compute the directory that actually contains index.html and 404.html.
      // We strip language prefixes and known app route segments so that
      // requests like /ru, /pl/news, /my-repo/ru/about all redirect to the
      // correct sibling index.html (supports root + GitHub project sites).
      function getAppBaseDir(pathname) {
        var p = String(pathname || '/').split('?')[0].split('#')[0];
        // Treat index.html etc as directory
        p = p.replace(/\/index\.html?$/i, '/').replace(/\.html?$/i, '');
        p = p.replace(/\/+/g, '/');
        if (p.length > 1 && p.endsWith('/')) p = p.slice(0, -1);
        var segs = p.split('/').filter(Boolean);

        // Segments that belong to the application (not deployment base)
        var knownApp = ['en', 'ru', 'pl', 'news', 'about', 'contact', 'contacts', 'page'];
        var known = {};
        for (var k = 0; k < knownApp.length; k++) known[knownApp[k]] = true;

        var i = 0;
        for (; i < segs.length; i++) {
          if (known[segs[i].toLowerCase()]) break;
        }
        var baseSegs = segs.slice(0, i);
        if (baseSegs.length === 0) return '/';
        return '/' + baseSegs.join('/') + '/';
      }

      var baseDir = getAppBaseDir(loc.pathname || '/');
      // Always use an origin-absolute path for the redirect target.
      // This guarantees we load the real index.html regardless of the
      // language-prefixed (or deep) path that triggered the 404.
      var target = baseDir + 'index.html?__spa_path=' + encodeURIComponent(intended);

      loc.replace(target);
    })();
  </script>
</head>
<body>
  <p style="font-family:sans-serif;padding:2rem;text-align:center;color:#64748b;">Redirecting…</p>
</body>
</html>
